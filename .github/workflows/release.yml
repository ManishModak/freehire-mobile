name: Release

# A release is a tag, not a merge. Every push to master would otherwise become a
# build and a new build in every tester's hands — expensive in EAS minutes and
# noisy for the testers. Tagging keeps the decision "this is worth shipping"
# explicit and in your hands:
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# The two platforms ship on different profiles on purpose. iOS goes out on
# `production` — that is the App Store build, and TestFlight is App Store
# Connect. Android goes out on `preview`, because `production` emits an .aab for
# Google Play and Firebase App Distribution needs an APK, which only the
# internal-distribution profiles produce.
on:
  push:
    tags: ['v*']

jobs:
  ios:
    name: iOS → TestFlight
    uses: ./.github/workflows/eas-build.yml
    with:
      platform: ios
      profile: production
      submit-ios: true
      # EAS created this internal group on the first submission and assigns
      # builds to it. Internal means every member needs a seat in App Store
      # Connect; handing the app to arbitrary addresses, the way Firebase does,
      # needs an External group instead — and Apple reviews the first build of
      # each version before those testers see it.
      testflight-group: "Team (Expo)"
    secrets: inherit

  android:
    name: Android → Firebase
    uses: ./.github/workflows/eas-build.yml
    with:
      platform: android
      profile: preview
      distribute-android: true
      testers-group: testers
    secrets: inherit
